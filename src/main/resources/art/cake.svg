<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Yummy Cake: a happy layered cake with a face, a candle and a cherry -->
  <!-- plate -->
  <ellipse cx="64" cy="116" rx="54" ry="9" fill="#E6E8F0"/>
  <ellipse cx="64" cy="114" rx="46" ry="6" fill="#FFFFFF"/>
  <!-- candle -->
  <rect x="60" y="14" width="8" height="24" rx="2" fill="#7EC8F0"/>
  <path d="M60 20 L68 16 M60 28 L68 24 M60 36 L68 32" stroke="#FFFFFF" stroke-width="2"/>
  <path d="M64 2 C70 8 68 13 64 14 C60 13 58 8 64 2 Z" fill="#FFB020"/>
  <path d="M64 6 C67 9 66 12 64 12 C62 12 61 9 64 6 Z" fill="#FFF2A0"/>
  <!-- sponge body -->
  <path d="M18 54 L18 108 Q64 120 110 108 L110 54 Z" fill="#F7C98A"/>
  <!-- cream filling stripe -->
  <path d="M18 80 Q64 90 110 80 L110 87 Q64 97 18 87 Z" fill="#FFF4F8"/>
  <!-- strawberry layer dots -->
  <circle cx="30" cy="84" r="3" fill="#F0507A"/>
  <circle cx="98" cy="84" r="3" fill="#F0507A"/>
  <!-- pink frosting top with drips -->
  <ellipse cx="64" cy="52" rx="46" ry="14" fill="#FF9EC0"/>
  <path d="M18 52 Q18 66 24 66 Q30 66 30 58 Q32 70 40 70 Q47 70 46 60 Q50 66 56 64 Q60 62 60 58 L68 58 Q68 66 76 66 Q83 66 82 58 Q86 72 94 70 Q100 68 98 60 Q104 66 110 60 L110 52 Z" fill="#FF9EC0"/>
  <ellipse cx="64" cy="48" rx="40" ry="9" fill="#FFB8D2"/>
  <!-- sprinkles -->
  <rect x="38" y="44" width="6" height="2.4" rx="1.2" fill="#FFE066" transform="rotate(-20 41 45)"/>
  <rect x="80" y="45" width="6" height="2.4" rx="1.2" fill="#7EE0A0" transform="rotate(25 83 46)"/>
  <rect x="52" y="50" width="6" height="2.4" rx="1.2" fill="#7EC8F0" transform="rotate(10 55 51)"/>
  <rect x="88" y="52" width="6" height="2.4" rx="1.2" fill="#FFFFFF" transform="rotate(-30 91 53)"/>
  <!-- cherry -->
  <path d="M78 40 Q82 30 90 28" stroke="#3A7A2A" stroke-width="2" fill="none"/>
  <circle cx="78" cy="42" r="6" fill="#E0203A"/>
  <circle cx="76" cy="40" r="1.8" fill="#FFFFFF" opacity="0.8"/>
  <!-- face -->
  <ellipse cx="48" cy="96" rx="5" ry="6" fill="#3B2A1C"/>
  <ellipse cx="80" cy="96" rx="5" ry="6" fill="#3B2A1C"/>
  <circle cx="49.5" cy="93.5" r="1.8" fill="#FFFFFF"/>
  <circle cx="81.5" cy="93.5" r="1.8" fill="#FFFFFF"/>
  <ellipse cx="38" cy="104" rx="5" ry="3" fill="#FF8AA0" opacity="0.7"/>
  <ellipse cx="90" cy="104" rx="5" ry="3" fill="#FF8AA0" opacity="0.7"/>
  <path d="M56 102 Q64 112 72 102 Q64 106 56 102 Z" fill="#8A2A3A" stroke="#3B2A1C" stroke-width="2" stroke-linejoin="round"/>
  <path d="M60 106 Q64 109 68 106" fill="#FF7A90"/>
</svg>

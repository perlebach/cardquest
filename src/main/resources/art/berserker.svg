  <!-- determined eyebrows and eyes -->
  <path d="M49 59 L59 62" stroke="#B5461E" stroke-width="3.4" stroke-linecap="round"/>
  <path d="M79 59 L69 62" stroke="#B5461E" stroke-width="3.4" stroke-linecap="round"/>
  <circle cx="56" cy="66" r="3.2" fill="#3B2A1C"/>
  <circle cx="72" cy="66" r="3.2" fill="#3B2A1C"/>

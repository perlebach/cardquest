    <rect x="13" y="22" width="6" height="86" rx="2" fill="#8A5A2B" transform="rotate(-12 16 65)"/>
    <path d="M6 20 C-2 26 -2 42 6 48 L18 42 L18 26 Z" fill="#C8D2DC" transform="rotate(-12 16 65)"/>
    <path d="M6 20 C2 26 2 42 6 48" stroke="#8E9BAA" stroke-width="2.5" fill="none" transform="rotate(-12 16 65)"/>
  </g>
  <g>
    <rect x="109" y="22" width="6" height="86" rx="2" fill="#8A5A2B" transform="rotate(12 112 65)"/>
    <path d="M122 20 C130 26 130 42 122 48 L110 42 L110 26 Z" fill="#C8D2DC" transform="rotate(12 112 65)"/>
    <path d="M122 20 C126 26 126 42 122 48" stroke="#8E9BAA" stroke-width="2.5" fill="none" transform="rotate(12 112 65)"/>
  </g>
  <!-- body with fur cloak -->
  <path d="M10 128 C10 104 30 90 64 90 C98 90 118 104 118 128 Z" fill="#6E8BA8"/>
  <path d="M44 128 L48 98 Q64 104 80 98 L84 128 Z" fill="#9A6A3A"/>

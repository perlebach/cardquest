  <!-- helmet -->
  <path d="M38 52 C38 32 50 24 64 24 C78 24 90 32 90 52 Z" fill="#9AA7B5"/>
  <path d="M46 40 C50 32 56 28 64 28 C58 32 52 36 50 44 Z" fill="#C8D2DC"/>

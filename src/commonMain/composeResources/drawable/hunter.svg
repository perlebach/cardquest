  <g transform="rotate(20 96 70)">
    <rect x="90" y="38" width="16" height="56" rx="5" fill="#8A5A2B"/>
    <rect x="90" y="46" width="16" height="5" fill="#6B4220"/>
    <path d="M93 38 L93 26 M98 38 L98 22 M103 38 L103 27" stroke="#D9C7A0" stroke-width="2.2"/>
    <path d="M90 28 L93 22 L96 28 Z M95 24 L98 17 L101 24 Z M100 29 L103 22 L106 29 Z" fill="#E04A3F"/>
  </g>
  <!-- body: tunic and cloak -->
  <path d="M10 128 C10 104 30 90 64 90 C98 90 118 104 118 128 Z" fill="#3E7D3A"/>
  <path d="M44 128 L48 96 Q64 102 80 96 L84 128 Z" fill="#9A6A3A"/>
  <rect x="44" y="112" width="40" height="6" fill="#5A3A1E"/>
  <rect x="60" y="111" width="8" height="8" rx="1.5" fill="#E0B43A"/>
  <!-- strap -->
  <path d="M86 94 L50 128" stroke="#5A3A1E" stroke-width="6"/>
  <!-- hood -->
  <path d="M30 88 C28 52 42 22 64 18 C86 22 100 52 98 88 Q64 100 30 88 Z" fill="#4C9A45"/>
  <path d="M64 18 C76 24 84 30 90 40 C80 32 72 30 64 30 Z" fill="#6DBB5F"/>
  <!-- face -->
  <ellipse cx="64" cy="64" rx="22" ry="24" fill="#2E6A2A"/>
  <ellipse cx="64" cy="66" rx="19" ry="21" fill="#FFC83D"/>
  <path d="M48 60 Q55 55 60 59" stroke="#7A4A25" stroke-width="2.6" fill="none" stroke-linecap="round"/>
  <path d="M68 59 Q73 55 80 60" stroke="#7A4A25" stroke-width="2.6" fill="none" stroke-linecap="round"/>
  <circle cx="56" cy="66" r="3.2" fill="#3B2A1C"/>
  <circle cx="72" cy="66" r="3.2" fill="#3B2A1C"/>
  <path d="M57 77 Q64 81 71 76" stroke="#3B2A1C" stroke-width="2.4" fill="none" stroke-linecap="round"/>
  <!-- bow (left), held low at the side; the lower half is cut off by the card edge -->
  <path d="M26 54 C2 82 2 126 26 154" stroke="#8A5A2B" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M26 54 C2 82 2 126 26 154" stroke="#B07A40" stroke-width="2" fill="none" stroke-linecap="round"/>
  <line x1="26" y1="54" x2="26" y2="154" stroke="#F4F1E8" stroke-width="1.6"/>
  <rect x="4" y="98" width="8" height="14" rx="3" fill="#5A3A1E"/>
  <circle cx="11" cy="106" r="7" fill="#FFC83D"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Priest: kind healer in white and gold, with a halo and a star wand -->
  <!-- halo -->
  <ellipse cx="64" cy="16" rx="24" ry="7" fill="none" stroke="#FFD34D" stroke-width="5"/>
  <ellipse cx="64" cy="16" rx="24" ry="7" fill="none" stroke="#FFF2B0" stroke-width="2"/>
  <!-- body / robe -->
  <path d="M10 128 C10 104 30 90 64 90 C98 90 118 104 118 128 Z" fill="#F4F4FA"/>
  <path d="M10 128 C10 104 30 90 64 90 C98 90 118 104 118 128" fill="none" stroke="#D6DAE8" stroke-width="2"/>
  <!-- golden stole -->
  <path d="M46 92 L52 128 L60 128 L56 94 Z" fill="#E0B43A"/>
  <path d="M82 92 L76 128 L68 128 L72 94 Z" fill="#E0B43A"/>
  <circle cx="54" cy="112" r="3" fill="#FFF2B0"/>
  <circle cx="74" cy="112" r="3" fill="#FFF2B0"/>
  <!-- hood -->
  <path d="M32 90 C28 54 42 26 64 24 C86 26 100 54 96 90 Q64 98 32 90 Z" fill="#FFFFFF"/>
  <path d="M32 90 C28 54 42 26 64 24 C86 26 100 54 96 90" fill="none" stroke="#E0B43A" stroke-width="3"/>
  <!-- face -->
  <ellipse cx="64" cy="66" rx="21" ry="23" fill="#E8ECF6"/>
  <ellipse cx="64" cy="67" rx="18.5" ry="20.5" fill="#FFC83D"/>
  <!-- happy closed eyes, rosy cheeks -->
  <path d="M51 65 Q55.5 60.5 60 65" stroke="#3B2A1C" stroke-width="2.6" fill="none" stroke-linecap="round"/>
  <path d="M68 65 Q72.5 60.5 77 65" stroke="#3B2A1C" stroke-width="2.6" fill="none" stroke-linecap="round"/>
  <ellipse cx="51" cy="73" rx="4" ry="2.6" fill="#FF9A7A" opacity="0.7"/>
  <ellipse cx="77" cy="73" rx="4" ry="2.6" fill="#FF9A7A" opacity="0.7"/>
  <!-- small white beard and smile -->
  <path d="M50 76 Q64 100 78 76 Q71 84 64 84 Q57 84 50 76 Z" fill="#FFFFFF"/>
  <path d="M58 77 Q64 81 70 77" stroke="#3B2A1C" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  <!-- star wand (left) -->
  <rect x="21" y="44" width="5" height="58" rx="2" fill="#E0B43A" transform="rotate(-10 23.5 73)"/>
  <circle cx="22" cy="30" r="15" fill="#FFF2B0" opacity="0.5"/>
  <path d="M22 16 L26 25.5 L36 26.5 L28.5 33 L30.8 43 L22 37.8 L13.2 43 L15.5 33 L8 26.5 L18 25.5 Z" fill="#FFD34D" stroke="#E0A030" stroke-width="1.5" stroke-linejoin="round"/>
  <circle cx="28" cy="104" r="7.5" fill="#FFC83D"/>
  <path d="M20 102 Q28 96 36 102 L36 108 Q28 104 20 108 Z" fill="#FFFFFF"/>
  <!-- sparkles -->
  <path d="M42 36 L43.2 39 L46 40 L43.2 41 L42 44 L40.8 41 L38 40 L40.8 39 Z" fill="#FFD34D"/>
  <path d="M104 70 L105.5 74 L109.5 75.5 L105.5 77 L104 81 L102.5 77 L98.5 75.5 L102.5 74 Z" fill="#FFD34D"/>
